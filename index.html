<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./pwa-192x192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E3A2B" />
    <meta name="description" content="S.P.O.T. - Agricultural Onion Quality Grading Progressive Web App" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="S.P.O.T." />
    <link rel="manifest" href="./manifest.json" />
    
    <!-- Non-blocking Google Fonts for Agricultural Accessible Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"></noscript>
    
    <title>S.P.O.T. - Onion Quality Scanner</title>
  </head>
  <body class="bg-[#F7F5F0] text-[#0F281E]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration for Offline Connectivity -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('S.P.O.T. ServiceWorker active:', reg.scope))
            .catch(err => console.log('S.P.O.T. ServiceWorker error:', err));
        });
      }
    </script>
  </body>
</html>
